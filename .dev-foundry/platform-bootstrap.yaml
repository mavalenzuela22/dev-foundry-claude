schema_version: dev-foundry.platform-bootstrap.v3
id: DFC-PLATFORM-BOOTSTRAP
title: dev-foundry-claude Platform Bootstrap
kind: platform-bootstrap
status: active
artifact_version: "2.3.0-local.1"
canonical: false
methodology_authority: false

repository:
  expected_name: dev-foundry-claude
  workspace_binding: process-bound-repository

sources:
  project_operating_profile: .dev-foundry/profiles/project-operating-profile.yaml
  authority_index: .dev-foundry/authority-index.yaml

actor_resolution:
  mode: governed-project-bindings
  eligible_profiles:
    - .dev-foundry/releases/2.3.0/actor-profiles/governance-author-v4.yaml
    - .dev-foundry/releases/2.3.0/actor-profiles/governance-auditor-v2.yaml
    - .dev-foundry/releases/2.3.0/actor-profiles/evidence-custodian-v1.yaml
  fixed_profile: null
  default_role: governance-author
  rule: >
    Resolve one role and versioned Actor Profile from the active POP v3 for each
    bounded operation; select the concrete implementation only for that operation
    after verifying identity, capability fit, Operator authorization and the
    applicable separation-of-duty or independent-audit rules. The previously
    configured producer-maintenance author capability, process-bound Runner
    Code Executor and mechanical validator are eligible candidates only when
    their operation-scoped proof and constraints actually fit. Neither the
    bootstrap nor mere tool availability grants role authority.

platform:
  id: chatgpt-project
  startup_constraints:
    - repository-dependent work uses the process-bound runner connected to dev-foundry-claude
    - repository authority is retrieved before role-dependent work
    - conversation memory generated summaries and other repositories are not repository authority
    - repository identity authority state and required capability mismatches fail closed

constraints:
  - this bootstrap establishes ChatGPT-project producer maintenance for dev-foundry-claude under ADR-004
  - active reusable methodology is sourced only from the POP-selected immutable canonical framework release
  - POP v3 owns stable role policy; concrete implementations and Capability Profiles are proven and selected per operation
  - capability does not grant authority
  - role selection is operation-scoped
  - independent audit eligibility is established from actual prior participation and active separation-of-duty rules
  - runner runtime state and product mechanics are not reusable methodology
  - the Implementation Executor is separately selected per operation and must prove fit to the existing implementation-executor-runner-v3 Capability Profile where applicable; governance author does not self-select that role
  - the Mechanical Validator is separately selected with trustworthy process-bound Runner evidence for the actual operation
  - Claude Code is the adapter target runtime and is not the active producer platform
  - root CLAUDE.md, .mcp.json, .claude and Claude Capability Profiles are product and distribution surface and do not bind any producer role
  - consumer repositories are never read or modified by producer governance and consume only explicit adapter releases
  - the deployed project system prompt is a non-authoritative derivative and must remain semantically aligned with this bootstrap
  - "Apply only currently adopted and active authority to the bounded operation; candidate, historical, and proposed rules are not current gates."
  - "Before blocking, identify the applicable mandatory rule, the observed conflict or missing prerequisite, and its material consequence; never turn assumptions, preferences, or hypothetical risks into new requirements."
  - "Apply OPS-007 necessity, reuse, and minimal sufficiency before introducing new controls, artifacts, mechanisms, repeated checks, or corrective scope."
  - "Before implementation handoff, verify consistency with current authority, contracts, and acceptance criteria; never delegate completed governance decisions back to the executor."
  - "Avoid uncoordinated repository mutations during active implementation or validation; reconcile resulting state and evidence after completion."
  - "Judge sufficiency against the Operator's authorized objective while preserving mandatory security, independence, validation, audit, and promotion requirements."