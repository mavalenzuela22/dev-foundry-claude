schema_version: dev-foundry.authority-index.v2
id: DFC-AUTHORITY-INDEX
title: dev-foundry-claude Repository Authority Index
kind: authority-index
status: active
artifact_version: "2.1.0-local.1"
canonical: false

subject:
  kind: project
  id: dev-foundry-claude
  version: null
  base_version: "2.1.0"
  manifest: null

routes:
  - id: active-framework
    path: .dev-foundry/releases/2.1.0/authority-index.yaml
    authority_class: methodology
    governs:
      - reusable-dev-foundry-methodology
    section_id: null
  - id: project-overview
    path: docs/00-overview/00 [OVR-001] PROJECT - System Overview.md
    authority_class: product
    governs:
      - project-purpose
      - project-boundary
      - current-greenfield-state
    section_id: null
  - id: project-documentation-map
    path: docs/00-overview/00 [OVR-002] PROJECT - Documentation Map and Artifact Taxonomy.md
    authority_class: configured
    governs:
      - project-documentation-map
      - project-authority-routing
    section_id: null
  - id: claude-native-governance-integration
    path: docs/10-decisions/10 [ADR-001] PROJECT - Claude-Native Governance Integration Boundary.md
    authority_class: product
    governs:
      - claude-native-repository-operation-boundary
      - claude-governance-mcp-boundary
      - token-economy-architecture-principle
    section_id: null
  - id: claude-code-adapter-architecture
    path: docs/20-architecture/20 [ARC-001] PROJECT - Claude Code Adapter Architecture.md
    authority_class: product
    governs:
      - claude-code-adapter-components
      - claude-code-primitive-responsibility-map
      - claude-code-context-loading-boundary
    section_id: null
  - id: tsk-001-claude-native-adapter-architecture
    path: docs/70-tasks/70 [TSK-001] PROJECT - Establish Claude-Native Adapter Architecture Baseline.md
    authority_class: product
    governs:
      - claude-native-adapter-architecture-baseline
    section_id: null

bindings:
  - id: project-operating-profile
    path: .dev-foundry/profiles/project-operating-profile.yaml
    kind: project-operating-profile
    authority_class: configured
    required: true
  - id: platform-bootstrap
    path: .dev-foundry/platform-bootstrap.yaml
    kind: platform-bootstrap
    authority_class: configured
    required: true

rules:
  single_authoritative_home_required: true
  unindexed_active_authority_forbidden: true
  evidence_is_normative: false
  consumer_copy_is_canonical: false
  runtime_capability_grants_authority: false
  automatic_framework_upgrade: false
