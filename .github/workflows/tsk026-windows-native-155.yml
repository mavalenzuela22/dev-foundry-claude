name: TSK-026 native adapter 1.5.5 acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-acceptance:
    name: Native ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Probe published adapter archives
        shell: bash
        env:
          TSK026_REPORT_ROOT: ${{ runner.temp }}
        run: node scripts/acceptance/tsk026-native-155.mjs
      - name: Upload native acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tsk026-native-155-${{ matrix.os }}
          path: ${{ runner.temp }}/tsk026-native-155-*/report.json
          if-no-files-found: warn
          retention-days: 14
