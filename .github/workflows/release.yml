name: Adapter release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adapter-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require main dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$DISPATCH_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/dashboard/package-lock.json
      - name: Restore dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix tools/dashboard --no-audit --no-fund
      - name: Derive exact release version
        id: identity
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const {version} = JSON.parse(fs.readFileSync("package.json")); if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error("Expected stable release version"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);'
      - name: Build normal package and verified release assets
        run: node scripts/release/build-assets.mjs --out "$RUNNER_TEMP/adapter-release"
      - name: Create new exact-commit tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tag="v$RELEASE_VERSION"
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if printf '%s\n' "$releases" | grep -Fx -- "$tag"; then
            echo "Release already exists: $tag" >&2
            exit 1
          fi
          # Creating a ref fails atomically if the tag exists, including races.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" --title "$tag" \
            "$RUNNER_TEMP/adapter-release/dev-foundry-claude-adapter-$RELEASE_VERSION.tgz" \
            "$RUNNER_TEMP/adapter-release/dev-foundry-claude-adapter.tgz" \
            "$RUNNER_TEMP/adapter-release/SHA256SUMS"
